name: DayOS
options:
  bundleIdPrefix: com.dayos
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    DAYOS_APP_GROUP: group.com.dayos.shared
targets:
  DayOS:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dayos.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Orbit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        DayOSAppGroup: $(DAYOS_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [dayos]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/DayOS.entitlements
      properties:
        com.apple.security.application-groups: [$(DAYOS_APP_GROUP)]
    dependencies:
      - target: DayOSWidgets
  DayOSWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dayos.app.widgets
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        DayOSAppGroup: $(DAYOS_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/DayOSWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(DAYOS_APP_GROUP)]
  DayOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DayOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DayOS:
    build:
      targets:
        DayOS: all
    test:
      targets: [DayOSTests]
