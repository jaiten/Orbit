name: Orbit
options:
  bundleIdPrefix: com.jaiten.orbit
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5T6K789X4T
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
    ORBIT_APP_GROUP: group.com.jaiten.orbit.shared
targets:
  Orbit:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaiten.orbit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Orbit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCalendarsFullAccessUsageDescription: Show your calendar events and let you save scheduled tasks to a calendar you choose.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        OrbitAppGroup: $(ORBIT_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [orbit]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/Orbit.entitlements
      properties:
        com.apple.security.application-groups: [$(ORBIT_APP_GROUP)]
    dependencies:
      - target: OrbitWidgets
  OrbitWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaiten.orbit.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Orbit Widgets
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Orbit Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrbitAppGroup: $(ORBIT_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/OrbitWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(ORBIT_APP_GROUP)]
  OrbitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Orbit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Orbit:
    build:
      targets:
        Orbit: all
    test:
      targets: [OrbitTests]
