name: iOS prototype
on:
  push:
    branches: [main]
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml', '.github/workflows/testflight.yml', 'scripts/prepare_testflight.py']
  pull_request:
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml', '.github/workflows/testflight.yml', 'scripts/prepare_testflight.py']
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    timeout-minutes: 35
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Choose available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Wait for simulator startup
        run: |
          # boot can report that the selected device is already running; bootstatus
          # still verifies that SpringBoard and the device services have finished starting.
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build and test app and extension
        working-directory: ios
        run: xcodebuild test -parallel-testing-enabled NO -project Orbit.xcodeproj -scheme Orbit -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath ../TestResults.xcresult
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments || true
          fi
      - name: Print Today screenshot for manual runs
        if: always() && github.event_name == 'workflow_dispatch'
        run: python3 scripts/print_screenshot.py TestAttachments "Orbit Today screenshot" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            TestAttachments
