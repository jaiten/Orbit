name: iOS prototype
run-name: iOS ${{ inputs.test_scope || 'smoke' }} checks — ${{ github.ref_name }}
on:
  push:
    branches: [main]
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml', '.github/workflows/testflight.yml', 'scripts/prepare_testflight.py', 'scripts/wait_for_testflight.py', 'scripts/run_ios_tests.sh', 'scripts/restore_source_mtimes.py', 'scripts/check_ios_sdk.py', 'scripts/tests/**', 'codemagic.yaml']
  pull_request:
    paths: ['ios/**', 'shared/**', '.github/workflows/ios.yml', '.github/workflows/testflight.yml', 'scripts/prepare_testflight.py', 'scripts/wait_for_testflight.py', 'scripts/run_ios_tests.sh', 'scripts/restore_source_mtimes.py', 'scripts/check_ios_sdk.py', 'scripts/tests/**', 'codemagic.yaml']
  workflow_dispatch:
    inputs:
      test_scope:
        description: Tests to run (manual runs do not upload to TestFlight)
        type: choice
        options: [smoke, full, unit, focused]
        default: smoke
      test_filter:
        description: For focused runs, e.g. OrbitUITests/ChecklistUITests/testNotesHaveSectionsAndPages
        type: string
        required: false
      upload_appetize:
        description: Upload the simulator preview to Appetize
        type: boolean
        default: false
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    timeout-minutes: 35
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate CI helpers
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify Xcode and iOS SDK requirements
        run: python3 scripts/check_ios_sdk.py
      - name: Restore source timestamps for incremental builds
        run: python3 scripts/restore_source_mtimes.py
      - name: Identify Xcode cache
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore Xcode build cache
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/OrbitDerivedData/Build
            ${{ runner.temp }}/OrbitDerivedData/ModuleCache.noindex
            ${{ runner.temp }}/OrbitDerivedData/SDKStatCaches.noindex
          key: ios-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/**/*.swift', 'ios/**/*.xcassets/**', 'ios/project.yml', 'shared/**') }}
          restore-keys: |
            ios-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Choose available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Wait for simulator startup
        run: |
          # boot can report that the selected device is already running; bootstatus
          # still verifies that SpringBoard and the device services have finished starting.
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build app, extensions and test bundles
        id: compile
        env:
          IOS_TEST_SCOPE: ${{ inputs.test_scope || 'smoke' }}
          IOS_TEST_FILTER: ${{ inputs.test_filter }}
        run: bash scripts/run_ios_tests.sh build
      - name: Package Orbit for browser simulator testing
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/OrbitDerivedData/Build/Products/Debug-iphonesimulator/Orbit.app"
          test -f "$app/Orbit"
          xcrun lipo -verify_arch arm64 "$app/Orbit"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Orbit-iOS-simulator.zip"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push'
        with:
          name: Orbit-iOS-simulator
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/Orbit-iOS-simulator.zip
      - name: Upload preview to Appetize
        if: github.event_name == 'workflow_dispatch' && inputs.upload_appetize
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$APPETIZE_API_TOKEN" ]]; then
            echo "::error::Set the APPETIZE_API_TOKEN Actions secret before requesting an upload."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 120 --output "$RUNNER_TEMP/appetize-response.json" \
            --write-out '%{http_code}' --header "X-API-KEY: $APPETIZE_API_TOKEN" \
            --form "file=@$RUNNER_TEMP/Orbit-iOS-simulator.zip" --form platform=ios \
            --form fileType=zip --form "note=Orbit preview $GITHUB_SHA" https://api.appetize.io/v1/apps/)
          if [[ "$status" != 2* ]]; then
            echo "::error::Appetize rejected the simulator upload (HTTP $status)."
            exit 1
          fi
          python3 -c 'import json, sys; response=json.load(open(sys.argv[1])); assert response.get("publicKey"), "Appetize did not return a build identifier"' "$RUNNER_TEMP/appetize-response.json"
          key=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["publicKey"])' "$RUNNER_TEMP/appetize-response.json")
          echo "Appetize accepted the Orbit iOS simulator build: https://appetize.io/app/$key"
          echo "::notice title=Appetize preview::https://appetize.io/app/$key"
      - name: Save Xcode build cache
        if: steps.compile.outcome == 'success' && github.event_name != 'pull_request' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/OrbitDerivedData/Build
            ${{ runner.temp }}/OrbitDerivedData/ModuleCache.noindex
            ${{ runner.temp }}/OrbitDerivedData/SDKStatCaches.noindex
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Verify device archive SDK without distribution credentials
        run: |
          xcodebuild archive -project ios/Orbit.xcodeproj -scheme Orbit -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Orbit-SDK-check.xcarchive" -derivedDataPath "$RUNNER_TEMP/OrbitDerivedData" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          python3 scripts/check_ios_sdk.py --archive "$RUNNER_TEMP/Orbit-SDK-check.xcarchive"
      - name: Run selected tests without rebuilding
        env:
          IOS_TEST_SCOPE: ${{ inputs.test_scope || 'smoke' }}
          IOS_TEST_FILTER: ${{ inputs.test_filter }}
        run: bash scripts/run_ios_tests.sh test
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments || true
          fi
      - name: Print Today screenshot for manual runs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.test_scope == 'full'
        run: python3 scripts/print_screenshot.py TestAttachments "Orbit Today screenshot" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          retention-days: 7
          path: |
            BuildResults.xcresult
            TestResults.xcresult
            TestAttachments
