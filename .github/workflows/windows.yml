name: Windows app
on:
  push:
    branches: [main]
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml']
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    timeout-minutes: 25
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      # Pull-request builds remain unsigned because repository secrets are not exposed.
      # Main/release builds are signed when these two secrets are configured.
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: Orbit-Windows
          path: windows/dist/Orbit-*.exe
