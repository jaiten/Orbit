# TestFlight builds on Codemagic (https://codemagic.io), which gives personal accounts 500 free macOS
# minutes a month: no Mac needed, and no GitHub Actions minutes. It runs the same signing and upload steps
# as .github/workflows/testflight.yml, with the same scripts and the same secrets (see docs/testflight.md,
# "Codemagic"). Builds start by hand from the Codemagic dashboard; it builds and uploads without running
# the UI tests, about 10-15 minutes.
workflows:
  testflight:
    name: TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 26.3
      groups:
        # CERTIFICATE_P12_BASE64, P12_PASSWORD, APP_PROFILE_BASE64, WIDGET_PROFILE_BASE64,
        # SHARE_PROFILE_BASE64 (optional), ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY
        - orbit_testflight
    scripts:
      - name: Check required credentials
        script: |
          for name in CERTIFICATE_P12_BASE64 P12_PASSWORD APP_PROFILE_BASE64 WIDGET_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "Missing Codemagic variable: $name (group orbit_testflight)"; exit 1; fi
          done
      - name: Install build tools
        script: |
          brew install xcodegen
          python3 -m pip install --user PyYAML==6.0.2
      - name: Prepare signing and project
        script: |
          set -euo pipefail
          umask 077
          # The shared scripts read GitHub's names. Build numbers come from 50000 + 100 x the Codemagic build
          # number, well above GitHub's (1000 + 100 x run number), so each upload is higher than the last.
          export RUNNER_TEMP="$CM_BUILD_DIR/.signing"
          mkdir -p "$RUNNER_TEMP"
          echo "RUNNER_TEMP=$RUNNER_TEMP" >> "$CM_ENV"
          export GITHUB_RUN_NUMBER=$((490 + BUILD_NUMBER))
          export GITHUB_RUN_ATTEMPT=1
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          KEYCHAIN_PATH="$RUNNER_TEMP/orbit-signing.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/orbit.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/orbit.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          python3 scripts/prepare_testflight.py
          xcodegen generate --spec ios/signing-project.json --project ios
      - name: Archive signed app and widget
        script: |
          set -o pipefail
          xcodebuild archive -project ios/Orbit.xcodeproj -scheme Orbit -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Orbit.xcarchive"
      - name: Export App Store package
        script: xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Orbit.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        script: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/Orbit.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Verify Apple finished processing this build
        script: python3 scripts/wait_for_testflight.py
      - name: Remove signing material
        script: |
          security delete-keychain "$RUNNER_TEMP/orbit-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP" "$HOME/.appstoreconnect/private_keys"
