<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Orbit</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mockup-theme.css"></head><body>
<aside><div class="brand"><img src="logo.svg" alt="" width="32" height="32"><strong>Orbit</strong></div><p class="tagline">A little space for what matters.</p><nav aria-label="Planner"><button data-page="today" class="selected"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg><span>Today</span></button><button data-page="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 2 2 3-4M11 6h10M3 13h3m5 0h10M3 20h3m5 0h10"/></svg><span>Lists</span></button><button data-page="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4"/></svg><span>Plan</span></button><button data-page="habits"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4C8 2 3 8 6 15s13 5 13-11ZM7 18l8-10"/></svg><span>Habits</span></button></nav><div class="list-heading">LISTS</div><div id="sidebar-lists" class="sidebar-lists"></div><button id="new-list" class="quiet-add">+ New list</button><div class="side-bottom"><button data-page="settings">Settings & sync</button><button id="sync-status" class="sync-indicator" aria-label="Sync status" title="Saved on this PC"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17a4 4 0 0 1-1-7.9A6 6 0 0 1 17 7a5 5 0 0 1 1 10M8 17l3 3 5-6"/></svg></button></div></aside>
<main><header><span id="breadcrumb">Your space / Today</span><button id="new-task" class="primary">+ Add</button></header><div class="page"><div id="notice" role="alert" hidden></div><div id="content"></div></div></main>
<dialog id="editor"><form id="task-form"><div class="dialog-head"><h2 id="editor-title">A little intention</h2><button type="button" data-close aria-label="Close">×</button></div><label>What would you like to do?<input name="title" required maxlength="500" placeholder="Give it a clear, small next step" autofocus></label><details class="capture-options"><summary>When & repeat</summary><div class="fields"><label>Day<input name="date" type="date"></label><label>Time (optional)<input name="time" type="time"></label><label>Minutes<input name="duration" type="number" min="5" max="1440" value="30"></label></div><label>Repeat<select name="recurrence"><option value="">Does not repeat</option><option value="FREQ=DAILY">Daily</option><option value="FREQ=WEEKLY">Weekly</option><option value="FREQ=MONTHLY">Monthly</option><option value="FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR">Weekdays</option><option value="FREQ=WEEKLY;BYDAY=SA,SU">Weekends</option></select></label></details><details class="capture-options"><summary>More options</summary><label>List<select name="listID" aria-label="List"></select></label><label>Notes<textarea name="notes" rows="3" placeholder="Anything that helps you get started"></textarea></label><div class="fields"><label>Priority<select name="priority"><option value="0">Normal</option><option value="1">Low</option><option value="2">Medium</option><option value="3">High</option></select></label></div></details><footer><button type="button" id="move-task" hidden>Move to non-negotiables</button><button type="button" id="delete-task" class="danger" hidden>Delete task</button><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save task</button></footer></form></dialog>
<dialog id="habit-editor"><form id="habit-form"><div class="dialog-head"><h2>Make room for a habit</h2><button type="button" data-close aria-label="Close">×</button></div><label>Habit<input name="title" required maxlength="500" placeholder="Read a few pages"></label><div class="fields"><label>Frequency<select name="frequency"><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option></select></label><label>Target<input name="target" type="number" min="1" max="1000" value="1" required></label></div><footer><button type="button" id="move-habit" hidden>Move to to-dos</button><button type="button" id="delete-habit" class="danger" hidden>Delete habit</button><button class="primary" type="submit">Save habit</button></footer></form></dialog>
<dialog id="list-editor"><form id="list-form"><div class="dialog-head"><h2>Your list</h2><button type="button" data-close aria-label="Close">×</button></div><label>Name<input name="name" required maxlength="100" placeholder="Personal"></label><label>Color<select name="color"><option value="sage">Sage</option><option value="lavender">Lavender</option><option value="honey">Honey</option><option value="clay">Coral</option></select></label><div id="list-delete-confirm" hidden><p>Delete this list? Its to-dos will move to Inbox.</p><button type="button" class="danger" id="confirm-delete-list">Delete list and keep to-dos</button></div><footer><button type="button" class="danger" id="delete-list" hidden>Delete list</button><button class="primary">Save list</button></footer></form></dialog><script src="planning.js"></script><script src="today.js"></script><script src="conversions.js"></script><script src="app.js"></script></body></html>
