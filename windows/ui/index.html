<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Orbit</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button
      id="toggle-sidebar"
      class="icon-button sidebar-toggle"
      aria-label="Hide main sidebar"
      title="Hide main sidebar"
    ></button>
    <aside class="sidebar">
      <div
        id="main-pane-grip"
        class="pane-grip"
        role="separator"
        aria-label="Main sidebar width"
        aria-orientation="vertical"
        aria-valuemin="180"
        aria-valuemax="360"
        tabindex="0"
      ></div>
      <button
        id="sidebar-search"
        class="search-field"
        aria-label="Search notes and tasks"
        aria-keyshortcuts="Control+F"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" /></svg
        ><span>Search</span><kbd>Ctrl+F</kbd>
      </button>
      <nav aria-label="Planner">
        <span class="nav-pill" aria-hidden="true"></span
        ><button data-page="today" class="selected" aria-keyshortcuts="Control+1">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            /></svg
          ><span>Today</span><kbd aria-hidden="true">Ctrl+1</kbd></button
        ><button data-page="calendar" aria-keyshortcuts="Control+2">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" /></svg
          ><span>Calendar</span><kbd aria-hidden="true">Ctrl+2</kbd></button
        ><button data-page="tasks" aria-keyshortcuts="Control+3">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6 2 2 4-4M12 6h8M4 14l2 2 4-4M12 14h8M12 20h8" /></svg
          ><span>Tasks</span><kbd aria-hidden="true">Ctrl+3</kbd></button
        ><button data-page="lists" aria-keyshortcuts="Control+4">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
            <path d="M14 3v5h5M9 13h6M9 17h4" /></svg
          ><span>Notes</span><kbd aria-hidden="true">Ctrl+4</kbd></button
        ><button data-page="habits" aria-keyshortcuts="Control+5">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3" /></svg
          ><span>Habits</span><kbd aria-hidden="true">Ctrl+5</kbd></button
        ><button data-page="settings" aria-keyshortcuts="Control+6">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"
            />
            <circle cx="12" cy="12" r="3" /></svg
          ><span>Settings</span><kbd aria-hidden="true">Ctrl+6</kbd>
        </button>
      </nav>

      <div id="sidebar-lists" class="sidebar-lists"></div>
      <button id="new-list" class="quiet-add">+ New section</button>
      <button id="sync-status" class="sync-status" aria-label="Sync status" title="Saved locally">
        <span id="sync-dot" aria-hidden="true"></span><span id="sync-text">Saved locally</span>
      </button>
      <button id="restart-update" class="restart-update" hidden>Update ready — restart</button>
    </aside>
    <main>
      <div class="page">
        <div id="notice" role="alert" hidden></div>
        <div id="content"></div>
        <div id="selection-bar" class="selection-bar" hidden>
          <span id="selection-count"></span><button id="copy-selected">Copy text</button
          ><button id="clear-selection">Done</button>
        </div>
        <div id="shortcut-hint" role="status" hidden></div>
      </div>
    </main>
    <dialog id="quick-add-dialog" class="quick-add-dialog">
      <form id="quick-add-form">
        <div class="eyebrow">Quick add</div>
        <label class="quick-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <input
            name="text"
            aria-label="Quick add"
            placeholder="gym tomorrow 6pm"
            maxlength="500"
            autocomplete="off"
            spellcheck="true"
          />
        </label>
        <div class="chip-row" aria-live="polite">
          <p id="quick-add-preview" class="chip" hidden></p>
        </div>
        <p class="quick-hint">Try “read every day”, “tomorrow at 6pm” or “someday”.</p>
        <footer>
          <button type="button" id="quick-add-details">More details…</button
          ><button type="button" data-close>Cancel</button><button class="primary" type="submit">Add</button>
        </footer>
      </form>
    </dialog>
    <dialog id="editor">
      <form id="task-form">
        <div class="dialog-head">
          <h2 id="editor-title">New Task</h2>
          <button type="button" data-close aria-label="Close">×</button>
        </div>
        <label>Title<input name="title" required maxlength="500" autofocus /></label>
        <details class="capture-options">
          <summary>Date & time</summary>
          <div class="fields">
            <label>Day<input name="date" type="date" /></label
            ><label>Time (optional)<input name="time" type="time" /></label
            ><label>Minutes<input name="duration" type="number" min="5" max="1440" value="30" /></label>
          </div>
        </details>
        <details class="capture-options">
          <summary>More options</summary>
          <label><input name="progressTracking" type="checkbox" />Track start &amp; finish</label>
          <label>Section<select name="listID" aria-label="Section"></select></label
          ><label>Notes<textarea name="notes" rows="3"></textarea></label>
          <div class="fields">
            <label
              >Priority<select name="priority">
                <option value="0">Normal</option>
                <option value="1">Low</option>
                <option value="2">Medium</option>
                <option value="3">High</option>
              </select></label
            >
          </div>
        </details>
        <div id="overlap-confirm" hidden>
          <p id="overlap-description"></p>
          <button type="button" id="save-overlap">Save anyway</button>
        </div>
        <footer>
          <button type="button" id="move-task" hidden>Make it a Habit</button
          ><button type="button" id="delete-task" class="danger" hidden>Delete</button
          ><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save</button>
        </footer>
      </form>
    </dialog>
    <dialog id="habit-editor">
      <form id="habit-form">
        <div class="dialog-head">
          <h2 id="habit-editor-title">New Habit</h2>
          <button type="button" data-close aria-label="Close">×</button>
        </div>
        <label>Title<input name="title" required maxlength="500" /></label>
        <div class="fields">
          <label
            >Repeats<select name="frequency">
              <option value="DAILY">Daily</option>
              <option value="WEEKDAYS">Weekdays</option>
              <option value="WEEKENDS">Weekends</option>
              <option value="WEEKLY">Weekly</option>
            </select></label
          ><label
            ><span id="habit-target-label">Times a day</span
            ><input name="target" type="number" min="1" max="1000" value="1" required
          /></label>
        </div>
        <label
          >Colour<select name="color">
            <option value="sage">Sage</option>
            <option value="lavender">Lavender</option>
            <option value="clay">Coral</option>
            <option value="honey">Honey</option>
          </select></label
        >
        <input type="hidden" name="icon" />
        <footer>
          <button type="button" id="move-habit" hidden>Make it a Task</button
          ><button type="button" id="delete-habit" class="danger" hidden>Delete</button
          ><button class="primary" type="submit">Save</button>
        </footer>
      </form>
    </dialog>
    <dialog id="list-editor">
      <form id="list-form">
        <div class="dialog-head">
          <h2 id="list-editor-title">New Section</h2>
          <button type="button" data-close aria-label="Close">×</button>
        </div>
        <label>Name<input name="name" required maxlength="100" placeholder="Personal" /></label
        ><label
          >Color<select name="color">
            <option value="sage">Sage</option>
            <option value="lavender">Lavender</option>
            <option value="honey">Honey</option>
            <option value="clay">Coral</option>
          </select></label
        >
        <div id="list-order-controls" class="fields">
          <button type="button" id="list-move-up">Move section up</button>
          <button type="button" id="list-move-down">Move section down</button>
        </div>
        <div id="list-delete-confirm" hidden>
          <p>Delete this section? Its notes and tasks are kept, without a section.</p>
          <button type="button" class="danger" id="confirm-delete-list">Delete Section, Keep Items</button>
        </div>
        <footer>
          <button type="button" class="danger" id="delete-list" hidden>Delete section</button
          ><button class="primary">Save</button>
        </footer>
      </form>
    </dialog>
    <div id="undo-toast" class="undo-toast" hidden>
      <span id="undo-label">Saved</span><button id="undo-change">Undo</button
      ><button id="dismiss-undo" aria-label="Dismiss Undo">×</button>
    </div>
    <dialog id="password-editor">
      <form id="password-form">
        <h2>Set a new password</h2>
        <label
          >New password<input
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required /></label
        ><label
          >Repeat password<input name="confirmation" type="password" autocomplete="new-password" minlength="8" required
        /></label>
        <footer>
          <button type="button" data-close>Cancel</button><button type="submit" class="primary">Save password</button>
        </footer>
      </form>
    </dialog>
    <dialog id="onboarding" class="onboarding" aria-label="Welcome to Orbit">
      <div id="onboarding-step"></div>
    </dialog>
    <dialog id="shortcuts-dialog">
      <div class="dialog-head">
        <h2>Keyboard Shortcuts</h2>
        <button type="button" data-close aria-label="Close">×</button>
      </div>
      <dl id="shortcuts-list" class="shortcuts"></dl>
    </dialog>
    <script src="planning.js"></script>
    <script src="notes.js"></script>
    <script src="habits.js"></script>
    <script src="recent-progress.js"></script>
    <script src="calendar-layout.js"></script>
    <script src="planner.js"></script>
    <script src="conversions.js"></script>
    <script src="onboarding-data.js"></script>
    <script src="icons.js"></script>
    <script src="core.js"></script>
    <script src="motion.js"></script>
    <script src="controls.js"></script>
    <script src="pages/today.js"></script>
    <script src="pages/tasks.js"></script>
    <script src="note-document.js"></script>
    <script src="pages/notes.js"></script>
    <script src="pages/calendar.js"></script>
    <script src="pages/habits.js"></script>
    <script src="pages/settings.js"></script>
    <script src="pages/account.js"></script>
    <script src="pages/review.js"></script>
    <script src="dialogs.js"></script>
    <script src="quick-add.js"></script>
    <script src="onboarding.js"></script>
    <script src="shortcuts.js"></script>
    <script src="updates.js"></script>
    <script src="selection.js"></script>
    <script src="sidebars.js"></script>
    <script src="app.js"></script>
  </body>
</html>
