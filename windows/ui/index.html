<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Orbit</title><link rel="stylesheet" href="styles.css"></head><body>
<aside><div class="brand"><img src="logo.svg" alt="" width="32" height="32"><strong>Orbit</strong></div><p class="tagline">A little space for what matters.</p><nav aria-label="Planner"><button data-page="today" class="selected">◉ <span>Today</span></button><button data-page="inbox">☷ <span>Inbox</span></button><button data-page="week">▦ <span>This week</span></button><button data-page="habits">◌ <span>Habits</span></button></nav><div class="side-bottom"><button data-page="settings">Settings & sync</button><p id="sync-status" role="status">Saved on this PC</p></div></aside>
<main><header><span id="breadcrumb">Your space / Today</span><button id="new-task" class="primary">+ New task</button></header><div class="page"><div id="notice" role="alert" hidden></div><div id="content"></div></div></main>
<dialog id="editor"><form id="task-form"><div class="dialog-head"><h2 id="editor-title">A little intention</h2><button type="button" data-close aria-label="Close">×</button></div><label>What would you like to do?<input name="title" required maxlength="500" placeholder="Give it a clear, small next step" autofocus></label><div class="fields"><label>Day<input name="date" type="date"></label><label>Time (optional)<input name="time" type="time"></label><label>Minutes<input name="duration" type="number" min="5" max="1440" value="30"></label></div><label>Notes<textarea name="notes" rows="3" placeholder="Anything that helps you get started"></textarea></label><div class="fields"><label>Priority<select name="priority"><option value="0">Normal</option><option value="1">Low</option><option value="2">Medium</option><option value="3">High</option></select></label><label>Repeat<select name="recurrence"><option value="">Does not repeat</option><option value="FREQ=DAILY">Daily</option><option value="FREQ=WEEKLY">Weekly</option><option value="FREQ=MONTHLY">Monthly</option></select></label></div><footer><button type="button" id="delete-task" class="danger" hidden>Delete task</button><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save task</button></footer></form></dialog>
<dialog id="habit-editor"><form id="habit-form"><div class="dialog-head"><h2>Make room for a habit</h2><button type="button" data-close aria-label="Close">×</button></div><label>Habit<input name="title" required maxlength="500" placeholder="Read a few pages"></label><div class="fields"><label>Frequency<select name="frequency"><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option></select></label><label>Target<input name="target" type="number" min="1" max="1000" value="1" required></label></div><footer><button type="button" id="delete-habit" class="danger" hidden>Delete habit</button><button class="primary" type="submit">Save habit</button></footer></form></dialog>
<script src="app.js"></script></body></html>
